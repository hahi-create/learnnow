<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1554D1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LearnNow">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>LearnNow</title>
<!-- Icons: Twemoji by Twitter/X and contributors (github.com/jdecked/twemoji), CC-BY 4.0 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#D9F1FF;
  --panel:#FFFFFF;
  --ink:#1E3A5F;
  --muted:#5B7896;
  --line:rgba(30,58,95,.12);
  --sun:#FFC93C;
  --sun-deep:#E3A300;
  --coral:#FF5E7E;
  --grass:#34B75A;
  --grass-deep:#23913F;
  --grape:#8A63FF;
  --sky:#2FA8F0;
  --display:"Baloo 2", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  --text:Andika, "Trebuchet MS", system-ui, sans-serif;
}
html{height:100%;box-sizing:border-box;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 12% 8%, #FFFFFF 0 2px, transparent 3px),radial-gradient(circle at 80% 30%, #FFFFFF 0 2px, transparent 3px);background-size:90px 90px,130px 130px}
#app{height:100%;padding-block:8px 8px;padding-inline:16px;display:flex;flex-direction:column;gap:8px}

/* top bar */
.top{position:relative;z-index:30;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;flex:0 0 36px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 0 rgba(30,58,95,.14)}
.caps-btn{width:auto;flex:0 0 auto;padding:0 11px;font:800 17px/1 var(--text);letter-spacing:.02em}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(30,58,95,.14)}
.icon-btn.off{color:#A9BACB}
.homebtn{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:800 17px/1 var(--display);cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 rgba(30,58,95,.14)}
.homebtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(30,58,95,.14)}
.homebtn .hi{font-size:22px;line-height:1}
.homebtn .hi img{width:1em;height:1em;display:block}
.homebtn .lbl{padding-top:3px}
.tn{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:6px;font:700 14px/1 var(--text);color:var(--ink);background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px 5px 6px;white-space:nowrap;overflow:hidden}
.tn .ticon{font-size:20px;line-height:1}
.tn #themeTitle{padding-top:2px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){ .homebtn .lbl{display:none} .homebtn{padding:0 9px} }
.spacer{flex:1}
.hex{width:40px;height:44px;flex:0 0 40px;background:var(--sun);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font:800 17px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;padding-top:4px}
.hex.bump{animation:bump .45s ease}

/* stage */
#stage{position:relative;flex:1 1 auto;min-height:0;border-radius:26px;overflow:hidden;background:#8FD8FF;border:4px solid #FFFFFF;box-shadow:0 6px 0 rgba(30,58,95,.1)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.popup{position:absolute;left:50%;top:13%;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
.popup.show{animation:popIn 1.6s ease both}
.pp{font:800 24px/1.1 var(--display);color:var(--grape);text-shadow:0 2px 0 #fff}
.pw{font:800 58px/1 var(--display);color:var(--coral);text-shadow:0 4px 0 #FFFFFF,0 8px 16px rgba(30,58,95,.2);padding-top:6px}
.ps{font:700 18px/1.3 var(--text);color:var(--ink);margin-top:4px;text-shadow:0 2px 0 rgba(255,255,255,.8)}
.hero-stars{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font:700 14px/1.3 var(--text);color:var(--muted)}
.hero-stars .hs-big{font:800 22px/1 var(--display);color:#B07A00}
.hero-stars b{color:var(--ink)}
#shelfStars{font:800 15px/1 var(--display);color:#B07A00;margin-right:10px}
.pstar{display:inline-block;margin:8px 0 0 6px;background:var(--sun);color:var(--ink);font:800 17px/1 var(--display);padding:8px 14px 5px;border-radius:999px;box-shadow:0 3px 0 var(--sun-deep)}
.madeby{text-align:right;font:700 14px/1.4 var(--text);color:var(--muted);padding-top:6px}
.pmean{margin-top:4px;font:800 22px/1.3 var(--text),"Zen Maru Gothic",sans-serif;color:var(--ink)}
.kj{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif!important;font-weight:700;color:var(--ink);line-height:1}
.slot .em.kj{font-size:30px;filter:none;opacity:.14}
.slot.got .em.kj{opacity:1}
.pnew{display:inline-block;margin-top:8px;background:var(--grass);color:#fff;font:800 16px/1 var(--display);padding:8px 14px 5px;border-radius:999px;box-shadow:0 3px 0 var(--grass-deep)}

/* overlay */
.overlay{position:absolute;inset:0;display:flex;padding:16px;background:rgba(255,255,255,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.card{margin:auto;width:min(100%,390px);background:var(--panel);border-radius:26px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:13px;box-shadow:0 8px 0 rgba(30,58,95,.12),0 24px 50px rgba(30,58,95,.18)}
.card h1{font:800 clamp(38px,9.5vw,50px)/.92 var(--display);margin:0;color:var(--coral);text-wrap:balance;padding-top:6px}
.card h1 span{color:var(--grape)}
.lead{margin:0;font-size:16.5px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;flex-direction:column;gap:6px;min-width:0}
.opt.wide{grid-column:1 / -1}
.opt-label{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:4px;background:#EEF6FC;padding:4px;border-radius:14px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 15px/1 var(--text);padding:10px 4px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff;box-shadow:0 3px 0 #1B86C7}
.go{margin-top:4px;border:0;background:var(--sun);color:var(--ink);font:800 28px/1 var(--display);padding:15px 16px 10px;border-radius:18px;cursor:pointer;box-shadow:0 6px 0 var(--sun-deep)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.fine{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.star-rules ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font:500 15px/1.45 var(--text),"Zen Maru Gothic",sans-serif;color:var(--ink)}
.star-rules b{color:#B07A00}
.linkish{align-self:flex-start;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font:400 13px var(--text);padding:0;cursor:pointer}
.linkish.armed{color:var(--coral)}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* on-screen keyboard */
.kbd{display:flex;flex-direction:column;gap:8px;transition:opacity .25s}
.kbd.rest{opacity:.35;pointer-events:none}
.kana{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);grid-auto-columns:minmax(42px,62px);gap:6px;width:max-content;max-width:100%;margin:0 auto;overflow-x:auto;padding-bottom:4px}
.kana .key{max-width:none;height:48px;font:700 25px/1 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
.kana .grp{margin-left:10px}
.kbd-en{display:flex;flex-direction:column;gap:8px}
.krow{display:flex;gap:8px;justify-content:center}
.krow:nth-child(2){padding-inline:4%}
.krow:nth-child(3){padding-inline:13%}
.key{flex:1 1 0;min-width:0;max-width:77px;height:61px;border-radius:16px;border:0;background:var(--panel);color:var(--ink);font:700 29px/1 var(--text);cursor:pointer;padding:0;box-shadow:0 4px 0 rgba(30,58,95,.16);transition:transform .08s,background .15s,color .15s}
.key.press{transform:translateY(2px) scale(.92)}
@media (max-height:600px){ .kbd{display:none} }

/* collection shelf */
.shelf{background:var(--panel);border-radius:19px;padding-block:8px 3px;padding-inline:13px;box-shadow:0 4px 0 rgba(30,58,95,.1)}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.shelf h2{margin:0;font:800 19px/1 var(--display);color:var(--grass);padding-top:3px}
#shelfCount{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
#shelfCount b{color:var(--coral);font-weight:700}
.shelf-row{position:relative;display:flex;gap:5px;overflow-x:auto;padding-block:7px 5px;scrollbar-width:thin;scrollbar-color:#C9DDEC transparent}
.slot{position:relative;flex:0 0 59px;height:67px;border-radius:13px;border:2px dashed #D3E4F1;background:#F4FAFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;cursor:default;color:#A9BACB;font-family:var(--text)}
.slot .em{font-size:28px;line-height:1;filter:brightness(0);opacity:.12}
.slot.got{border:2px solid transparent;background:var(--tint,#EAFBEA);cursor:pointer;color:var(--ink)}
.slot.got .em{filter:none;opacity:1}
.slot .nm{font-size:12px;font-weight:700;max-width:54px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sk{position:absolute;top:2px;left:2px;background:var(--sun);color:#7A5200;font:800 11px/1 var(--display);padding:3px 4px 1px;border-radius:999px}
.slot .ct{position:absolute;top:2px;right:2px;background:var(--coral);color:#fff;font:800 11px/1 var(--display);padding:3px 4px 1px;border-radius:999px}
.slot.pop{animation:slotPop .55s ease}

.em img,.flyer img,.av img,.ticon img,.edit img,.icons button img{width:1em;height:1em;display:block;margin:auto}
.flyer{position:fixed;left:0;top:0;z-index:50;line-height:1;pointer-events:none;transform:translate(-50%,-50%);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* players */
.chip{display:flex;align-items:center;gap:6px;height:36px;max-width:42%;flex:0 1 auto;padding:0 12px 0 7px;border:0;border-radius:999px;background:var(--panel);color:var(--ink);font:700 14px/1 var(--text);cursor:pointer;box-shadow:0 3px 0 rgba(30,58,95,.14)}
.chip .av{font-size:22px;line-height:1}
.chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
.view{display:flex;flex-direction:column;gap:13px}
.chip .caret{font-size:11px;color:var(--muted)}
.chip[aria-expanded="true"]{background:#E1F3FF}
.pmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:40;width:min(340px,100%);max-height:calc(100vh - 80px);overflow-y:auto;background:var(--panel);border-radius:20px;padding:14px;box-shadow:0 6px 0 rgba(30,58,95,.1),0 20px 44px rgba(30,58,95,.22)}
.pm-title{font:800 20px/1.1 var(--display);color:var(--grape);padding-top:3px}
.players{display:flex;flex-direction:column;gap:6px}
.plw{display:flex;align-items:center;gap:6px}
.pl{flex:1;min-width:0;padding:7px 12px 7px 8px;border-radius:14px;border:3px solid transparent;background:#EEF6FC;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font:700 15px/1.15 var(--text);text-align:left}
.pl .av{font-size:28px;line-height:1}
.pl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pc{font-size:11.5px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.pl[aria-pressed="true"]{border-color:var(--sky);background:#E1F3FF}
.pl.add{border:3px dashed #C9DDEC;background:transparent;color:var(--muted)}
.pl.add .av{font:800 26px/1 var(--display);color:var(--sky);width:28px;text-align:center}
.edit{flex:0 0 36px;width:36px;height:36px;border:0;border-radius:12px;background:var(--sun);display:grid;place-items:center;font-size:15px;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 0 var(--sun-deep)}
.editor input{width:100%;font:700 18px/1.2 var(--text);color:var(--ink);padding:10px 12px;border-radius:12px;border:2px solid #D3E4F1;background:#F7FBFF}
.editor input:focus{outline:none;border-color:var(--sky)}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,76px));gap:8px;justify-content:start}
.icons button{aspect-ratio:1;max-width:100%;border:2px solid transparent;border-radius:10px;background:#F4FAFF;font-size:clamp(24px,4.2vw,46px);line-height:1;cursor:pointer;padding:0;display:grid;place-items:center}
.icons button[aria-pressed="true"]{border-color:var(--sky);background:#E1F3FF;transform:scale(1.08)}
.ed-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.voice-row{display:flex;gap:6px}
.voice-row select{flex:1;min-width:0;font:700 14px/1.2 var(--text);color:var(--ink);padding:9px 10px;border-radius:12px;border:2px solid #D3E4F1;background:#F7FBFF;cursor:pointer}
.voice-row select:focus{outline:none;border-color:var(--sky)}
.voice-row .btn-sec{padding:9px 12px;white-space:nowrap}
.btn-pri{border:0;background:var(--grass);color:#fff;font:800 19px/1 var(--display);padding:11px 22px 8px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--grass-deep)}
.btn-pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grass-deep)}
.btn-sec{border:0;background:#EEF6FC;color:var(--ink);font:700 15px/1 var(--text);padding:11px 16px;border-radius:14px;cursor:pointer}
.linkish.danger{margin-right:auto}
.shelf h2 span{color:var(--ink)}

/* home screen */
.home{position:fixed;inset:0;z-index:60;overflow-y:auto;background:linear-gradient(180deg,#48BDF7 0%,#98DCFF 40%,#D9F1FF 100%);padding-block:calc(16px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));padding-inline:16px}
.home-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.home-in > .view{gap:16px}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:800 clamp(46px,9vw,76px)/.9 var(--display);color:var(--coral);text-shadow:0 4px 0 #fff;padding-top:8px}
.logo span{color:var(--grape)}
.tag{font:700 16px/1.3 var(--text);color:var(--ink);margin-top:4px}
.hcard{background:rgba(255,255,255,.94);border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(30,58,95,.08)}
.hcard h2{margin:0 0 12px;font:800 21px/1 var(--display);color:var(--ink);padding-top:3px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-av{font-size:68px;line-height:1}
.hero-txt{flex:1;min-width:170px}
.hero-hello{font:800 30px/1.05 var(--display);color:var(--ink);padding-top:4px}
.hero-stat{font:700 15px/1.3 var(--text);color:var(--muted);margin-top:4px}
.family{font:400 13px/1.5 var(--text);color:var(--muted);margin-top:4px}
.family b{color:var(--ink);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.family .fcode{font:800 24px/1 var(--display);color:var(--grape);letter-spacing:.08em;padding-top:4px}
.family .fine{margin-top:6px}
.family .linkish{display:inline;margin-left:6px}
.family-join{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.family-join input.fname{width:14em;text-transform:none;letter-spacing:0}
.family-join input{width:9.5em;font:700 16px/1.2 var(--text);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:8px 10px;border-radius:10px;border:2px solid #D3E4F1;background:#F7FBFF}
.family-join input:focus{outline:none;border-color:var(--sky)}
.family-join .btn-sec{padding:9px 14px}
.sync-note{font:400 13px/1.4 var(--text);color:var(--muted);margin-top:6px;max-width:46ch}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hbtn{border:0;border-radius:16px;padding:13px 18px 11px;font:800 18px/1 var(--display);cursor:pointer;background:#E4F4FF;color:var(--ink);box-shadow:0 4px 0 #B9DDF3}
.bi{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.28em;margin-right:6px}
.bi img{width:100%;height:100%;display:block}
.hbtn.small{font-size:16px;padding:10px 14px 8px}
.home-actions{display:flex;align-items:center;gap:8px}
.fam-opts{grid-template-columns:1fr}
.hbtn.gold{background:#FFF3C4;box-shadow:0 4px 0 var(--sun)}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #B9DDF3}
.hthemes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){ .hthemes{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:4px solid transparent;background:#F4FAFF;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--text)}
.tcard .ic{font-size:42px;line-height:1}
.tcard .tx{flex:1;min-width:0}
.tcard .tnm{font:800 19px/1.1 var(--display);padding-top:2px}
.tcard .tpc{font:700 12px/1 var(--text);color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tcard[aria-pressed="true"]{border-color:var(--sky);background:#E1F3FF}
.tcard.all{grid-column:1 / -1;background:linear-gradient(90deg,#FFE8EE,#FFF5D6,#E6F9EA,#E4F4FF,#F0EAFF)}
.tcard.all[aria-pressed="true"]{border-color:var(--sky)}
.bar{height:8px;border-radius:8px;background:#DCEBF6;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grass);border-radius:8px}
.seg[data-key="lang"] button{font-family:var(--text),"Zen Maru Gothic",sans-serif}
.seg.big button{font-size:19px;padding:14px 6px}
.vol{display:grid;grid-template-columns:8.2em 1fr 3.4em;align-items:center;gap:10px;font:700 16px/1.2 var(--text);color:var(--ink);padding:4px 0}
.vol input{width:100%;height:30px;margin:0;accent-color:var(--sky);cursor:pointer}
.vol b{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.lang-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lang-sub .seg button{font-size:17px;padding:10px 4px;font-family:var(--text),"Zen Maru Gothic",sans-serif}
.lang-sub .seg.dim{opacity:.5}
details.more summary{cursor:pointer;font:800 19px/1 var(--display);color:var(--ink);padding-top:3px}
details.more[open] summary{margin-bottom:14px}
.hplay{position:sticky;bottom:12px;align-self:center;width:min(440px,100%);font-size:34px;padding:18px 16px 13px}
.hv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hv-head h2{margin:0;font:800 28px/1 var(--display);color:var(--ink);padding-top:4px}
.hplayers{display:flex;flex-wrap:wrap;gap:12px}
.hp{position:relative}
.tile{width:112px;padding:14px 6px 10px;border-radius:20px;border:4px solid transparent;background:#EEF6FC;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:700 15px/1.1 var(--text);color:var(--ink)}
.tile .av{font-size:50px;line-height:1}
.tile .nm{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .pc{font:400 12px/1 var(--text);color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--sky);background:#E1F3FF}
.tile.add{border:4px dashed #C9DDEC;background:transparent;color:var(--muted);justify-content:center;min-height:132px}
.tile.add .av{font:800 46px/1 var(--display);color:var(--sky)}
.hp .edit{position:absolute;top:-6px;right:-6px}
.rank li.home{background:#FFF8DD}
.rank .kstar{display:inline-block;margin-left:4px;padding:2px 8px 1px;border-radius:999px;background:#FFF3C4;color:#9A6B00;font:800 14px/1.2 var(--display);vertical-align:2px}
.rank .fam.none{font-style:italic;opacity:.75}
.rank .fam{font:700 12.5px/1.2 var(--text);color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li.rank-empty{display:block;padding:22px 16px;text-align:center;color:var(--muted);font:700 16px/1.5 var(--text)}
.rank-hint{background:#FFF3C4;border:3px solid var(--sun);border-radius:18px;padding:14px 16px;margin-bottom:14px;color:var(--ink);font:700 17px/1.45 var(--text)}
.rank-hint .rh-title{font:800 21px/1.15 var(--display);padding-top:3px;margin-bottom:4px}
.rank-hint .rh-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rank-modes{margin-bottom:10px;max-width:520px}
.rank-modes button{font-family:var(--text),"Zen Maru Gothic",sans-serif}
.rank-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rank-tabs button{border:0;border-radius:999px;padding:9px 13px 8px;font:700 14px/1 var(--text);background:#EEF6FC;color:var(--ink);cursor:pointer}
.rank-tabs button[aria-pressed="true"]{background:var(--sky);color:#fff}
.rank{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:44px 46px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:#F4FAFF}
.rank li.me{background:#E1F3FF;box-shadow:inset 0 0 0 3px var(--sky)}
.rank .pos{font:800 26px/1 var(--display);text-align:center;color:var(--muted);padding-top:3px}
.rank .av{font-size:40px;line-height:1}
.rank .nm{font:800 19px/1.1 var(--display);padding-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .n{font:800 22px/1 var(--display);color:var(--coral);font-variant-numeric:tabular-nums;padding-top:3px}
.home-btn{align-self:center}
.modal{position:fixed;inset:0;z-index:80;display:flex;padding:16px;background:rgba(30,58,95,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.modal-card{margin:auto;width:min(580px,100%);background:var(--panel);border-radius:26px;padding:22px 20px 20px;box-shadow:0 8px 0 rgba(30,58,95,.12),0 24px 50px rgba(30,58,95,.25)}
.modal-hi{font:800 32px/1.1 var(--display);color:var(--coral);padding-top:4px}
.upd-card{width:min(440px,100%);text-align:center}
.upd-btns{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.upd-btns .go{margin-top:0;padding-inline:34px}
.modal-card > p{margin:6px 0 14px;font:700 17px/1.45 var(--text);color:var(--ink)}
#edMsg{color:var(--coral);font-weight:700}
#homeEditSlot{align-self:center;width:min(640px,100%)}
.hero-av img,.tcard .ic img{width:1em;height:1em;display:block}

@keyframes bump{40%{transform:scale(1.25)}}
@keyframes pulse{50%{transform:translateY(-2px) scale(1.08)}}
@keyframes slotPop{0%{transform:scale(1)}35%{transform:scale(1.3) rotate(-6deg)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes popIn{
  0%{opacity:0;transform:translateX(-50%) scale(.5)}
  14%{opacity:1;transform:translateX(-50%) scale(1.1)}
  24%{transform:translateX(-50%) scale(1)}
  78%{opacity:1;transform:translateX(-50%) translateY(0)}
  100%{opacity:0;transform:translateX(-50%) translateY(-24px)}
}
@media (prefers-reduced-motion: reduce){
  .hex.bump,.slot.pop{animation:none}
  .popup.show{animation-duration:.01s;animation-fill-mode:none}
}
</style>

<script>
(() => {
const $ = s => document.querySelector(s);
// no pinch or double-tap zoom on phones and iPads: a zoomed-in page is hard for small hands to get back from
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive:false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault();
  lastTouchEnd = now;
}, { passive:false });
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

};

const tname = t => t[settings.lang] || t.en;                     // a theme's name in the language being practised
const themeOf = (k, mode) => (mode || curMode()) === 'kanji' ? KANJI_THEME : THEMES[k];
const THEME_ORDER = ['zoo', 'car', 'food', 'job', 'all'];   // "all" mixes every theme and sits last
const RAW_THEMES = {
  zoo: [
  // 2–3 letters
  ['🐱','cat'],['🐶','dog'],['🐷','pig'],['🐮','cow'],['🦊','fox'],['🦉','owl'],['🐝','bee'],['🐜','ant'],
  ['🐔','hen'],['🦇','bat'],['🐂','ox'],['🐏','ram'],['🐀','rat'],['🪰','fly'],
  // 4–5 letters
  ['🦆','duck'],['🐟','fish'],['🐸','frog'],['🦁','lion'],['🐻','bear'],['🐐','goat'],['🦀','crab'],['🐦','bird'],

  ['🏄','surfer'],['⛷️','skier'],['🧗','climber'],['🤴','prince'],['👸','princess'],['🧙','wizard']

// animals keep their plain name as id so collections saved before themes existed still count
const byLen = (a, b) => a.en.replace(/ /g, '').length - b.en.replace(/ /g, '').length;
let colorIx = 0;
const ALL_ITEMS = ['zoo', 'car', 'food', 'job'].flatMap(t => RAW_THEMES[t]
  .map(([e, en]) => ({ e, en, theme: t, id: t === 'zoo' ? en : t + ':' + en, ci: colorIx++ % BUBBLES.length }))

// can this device draw the emoji in colour, as one picture?
const emojiProbe = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 48;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.font = `36px ${EMOJI_FONT}`; x.textBaseline = 'middle'; x.textAlign = 'center';
  const ref = x.measureText('🐱').width || 36;
  const test = e => {
    if (x.measureText(e).width > ref * 1.4) return false;       // a joined emoji fell apart into two pictures
    x.clearRect(0, 0, 48, 48); x.fillStyle = '#000'; x.fillText(e, 24, 26);
    const d = x.getImageData(0, 0, 48, 48).data;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 128 && d[i] + d[i + 1] + d[i + 2] > 90) return true;
    return false;                                               // nothing drawn, or a plain black box
  };
  let works = false;
  try { works = test('🐱') && !test('\uE000'); } catch(e){}
  return e => !works || test(e);                                // if the check itself is unreliable, trust the emoji
})();
const ITEMS = ALL_ITEMS.filter(d => {
  if (d.kanji) return true;                                     // drawn as text in a Japanese font
  if (ICONS[d.e]){ d.img = new Image(); d.img.src = ICONS[d.e]; return true; }   // same picture on every device
  return emojiProbe(d.e);                                       // no bundled picture: only if this device can draw it
});
const byTheme = t => t === 'all' ? ITEMS : ITEMS.filter(d => d.theme === t);
let THEME_ITEMS = byTheme('zoo');                               // what the current theme plays with
const playItems = () => curMode() === 'kanji' ? ITEMS : THEME_ITEMS;   // 漢字 always plays the whole set
// an item's picture: its icon, or for a kanji the character itself
function setItemIcon(el, d){ if (d.kanji){ el.textContent = d.e; el.classList.add('kj'); } else setIcon(el, d.e); }
// show an icon from the icon store in an element (plain emoji only if the store has no picture for it)
function setIcon(el, e){
  el.textContent = '';
  if (ICONS[e]){ const im = document.createElement('img'); im.src = ICONS[e]; im.alt = ''; im.draggable = false; el.appendChild(im); }
  else el.textContent = e;
}

function spawn(){
  const onIds = new Set(animals.map(a => a.def.id));
  const firsts = new Set(animals.filter(a => !a.done).map(a => a.keys[a.i]));
  let cands = pool().filter(d => !onIds.has(d.id) && d.id !== lastId);
  const distinct = cands.filter(d => { const w = wordOf(d); return !firsts.has(isJa() ? kanaKeys(w[0])[0] : baseOf(w[0])); });
  if (distinct.length) cands = distinct;
  if (!cands.length) return false;
  const bag = [];
  cands.forEach(d => { const w = counts[ck(d)] ? 1 : 3; for (let i = 0; i < w; i++) bag.push(d); });
  const def = bag[Math.floor(Math.random() * bag.length)];
  const word = wordOf(def), chars = buildChars(word);
  const ang = Math.random() * Math.PI * 2, sp = LEVELS[settings.level].speed;
  const a = {
    def, word, chars, keys: chars.flatMap(c => c.ks), i:0, done:false,

// ---------- update + draw ----------
function update(dt){
  const L = LEVELS[settings.level];
  spawnT -= dt;
  if (spawnT <= 0){ spawnT = (animals.length < L.max && !spawn()) ? .5 : L.every; }
  for (const a of animals){
    a.age += dt;
    // gentle wandering: slowly curve the heading, keep a steady speed
    const turn = Math.sin(t * .6 + a.phase) * .5 * dt, c = Math.cos(turn), s = Math.sin(turn);
    const vx = a.vx * c - a.vy * s, vy = a.vx * s + a.vy * c, m = Math.hypot(vx, vy) || 1;
    a.vx = vx / m * L.speed; a.vy = vy / m * L.speed;
    const slow = a === target ? .4 : 1;      // the animal being typed slows down
    a.x += a.vx * slow * dt; a.y += a.vy * slow * dt;
    const b = bounds(a);
    if (a.x < b.minX){ a.x = b.minX; a.vx = Math.abs(a.vx); }
    if (a.x > b.maxX){ a.x = b.maxX; a.vx = -Math.abs(a.vx); }
    if (a.y < b.minY){ a.y = b.minY; a.vy = Math.abs(a.vy); }
    if (a.y > b.maxY){ a.y = b.maxY; a.vy = -Math.abs(a.vy); }
    a.shake = Math.max(0, a.shake - dt * 3);
    a.flash = Math.max(0, a.flash - dt * 4);
  }
  // animals bounce off each other so bubbles and names never overlap
  for (let i = 0; i < animals.length; i++) for (let j = i + 1; j < animals.length; j++){
    const p = animals[i], q = animals[j], A = box(p, 5), B = box(q, 5);
    const ox = Math.min(A.r, B.r) - Math.max(A.l, B.l), oy = Math.min(A.b, B.b) - Math.max(A.t, B.t);
    if (ox <= 0 || oy <= 0) continue;
    if (ox < oy){
      const d = p.x < q.x ? -1 : 1;
      p.x += d * ox / 2; q.x -= d * ox / 2;
      p.vx = d * Math.abs(p.vx); q.vx = -d * Math.abs(q.vx);
    } else {
      const d = p.y < q.y ? -1 : 1;
      p.y += d * oy / 2; q.y -= d * oy / 2;
      p.vy = d * Math.abs(p.vy); q.vy = -d * Math.abs(q.vy);
    }
  }
  for (const b of bullets){
    const tx = animX(b.a), ty = animY(b.a), dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy), step = 1100 * dt;
    b.trail.push({ x:b.x, y:b.y }); if (b.trail.length > 7) b.trail.shift();
    if (d <= step + R() * .5){
      b.hit = true; b.a.flash = 1;
      burst(tx, ty - R() * .3, 8, [b.c, '#FFFFFF', C.sun], 170);
      if (b.final) capture(b.a); else sfx.pop();
    } else { b.x += dx / d * step; b.y += dy / d * step; }
  }
  bullets = bullets.filter(b => !b.hit);
  for (const p of parts){ p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.vx *= .985; p.rot += p.vr * dt; }
  parts = parts.filter(p => p.life < p.max);

  const want = target ? Math.atan2(animX(target) - s.x, -(animY(target) - s.y)) : 0;
  shipAng += (want - shipAng) * Math.min(1, dt * 8);
  shipShake = Math.max(0, shipShake - dt * 3);
}

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

  ctx.arc(x + 56 * s, y - 2 * s, 22 * s, 0, 7); ctx.arc(x + 30 * s, y + 8 * s, 22 * s, 0, 7);
  ctx.fill();
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, H);

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const sx = W - 46, sy = 46;
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(reduced ? 0 : t * .25);
  ctx.fillStyle = 'rgba(255,222,89,.55)';
  for (let i = 0; i < 12; i++){ ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(-5, 38); ctx.lineTo(0, 58); ctx.lineTo(5, 38); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#FFD84A'; ctx.beginPath(); ctx.arc(sx, sy, 32, 0, 7); ctx.fill();
  ctx.fillStyle = '#FFE98A'; ctx.beginPath(); ctx.arc(sx - 8, sy - 8, 14, 0, 7); ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds) cloud(c.x - 30 * c.s, c.y, c.s);
  // hills
  const hill = (base, amp, len, ph, col) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, base + Math.sin(x / len + ph) * amp);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  };
  hill(H - 58, 14, 70, 1.2, '#A6EA8E');
  hill(H - 32, 10, 55, 3.1, '#5ACB63');
  // flowers on the front hill
  for (let x = 24; x < W; x += 64){
    const y = H - 20 + Math.sin(x / 55 + 3.1) * 6;
    ctx.fillStyle = ['#FF7EA8', '#FFD84A', '#FFFFFF', '#B79BFF'][(x / 64 | 0) % 4];
    for (let k = 0; k < 5; k++){ const a = k * 1.2566; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 3.2, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#FF9A3C'; ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
  }
}

function drawAnimal(a){
  const x = animX(a), y = animY(a), r = R(), locked = a === target, col = BUBBLES[a.def.ci];
  // pop-in when it appears
  const k = reduced ? 1 : easeBack(Math.min(1, a.age / .45));
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y);
  // bubble
  ctx.fillStyle = 'rgba(30,58,95,.08)'; ctx.beginPath(); ctx.ellipse(x, y + r + 4, r * .7, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.globalAlpha = .55; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.globalAlpha = 1; ctx.lineWidth = locked ? 4 : 3; ctx.strokeStyle = locked ? C.sun : '#FFFFFF'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(x - r * .45, y - r * .5, r * .18, r * .1, -.7, 0, 7); ctx.fill();
  if (locked){
    ctx.save(); ctx.fillStyle = C.sun;
    for (let i = 0; i < 4; i++){ const a2 = t * 1.8 + i * Math.PI / 2; star(x + Math.cos(a2) * (r + 11), y + Math.sin(a2) * (r + 11), 6, a2); ctx.fill(); }
    ctx.restore();
  }
  // animal
  const sc = 1 + a.flash * .22;
  ctx.save(); ctx.translate(x, y + r * .06); ctx.scale(sc, sc);
  if (a.def.img){ const s = r * 1.3; if (a.def.img.complete) ctx.drawImage(a.def.img, -s / 2, -s / 2 - r * .04, s, s); }
  else if (a.def.kanji){
    ctx.font = `700 ${Math.round(r * 1.05)}px "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.ink;
    ctx.fillText(a.def.e, 0, r * .04);
  }
  else {
    ctx.font = `${Math.round(r * 1.25)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(a.def.e, 0, 0);
  }
  ctx.restore();
  // name tag
  const fs = FS(); ctx.font = `700 ${fs}px ${TEXT_FONT}`;
  const disp = a.chars.map(c => capsOf(c.d)), ws = disp.map(s => ctx.measureText(s).width);
  const tw = ws.reduce((s, w) => s + w, 0), px = 12, h = fs + 14;
  let lx = Math.max(6 + px, Math.min(W - 6 - px - tw, x - tw / 2));
  const ly = y + r + 10;
  ctx.fillStyle = 'rgba(30,58,95,.15)'; roundRect(lx - px, ly + 3, tw + px * 2, h, h / 2); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; roundRect(lx - px, ly, tw + px * 2, h, h / 2); ctx.fill();
  if (locked){ ctx.strokeStyle = C.sun; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const showFirst = !target && state === 'play';
  let cx = lx;
  disp.forEach((s, j) => {
    const c = a.chars[j];
    if (c.k){
      const typed = c.ki + c.kn <= a.i, isNext = !typed && c.ki <= a.i && !a.done;
      if (isNext && (locked || showFirst)){
        ctx.fillStyle = locked ? C.coral : 'rgba(255,201,60,.9)';
        roundRect(cx + 1, ly + h - 7, ws[j] - 2, 3.5, 1.5); ctx.fill();
      }
      ctx.fillStyle = typed ? C.grass : C.ink;
      ctx.fillText(s, cx, ly + h / 2 + 1);
    }
    cx += ws[j];
  });
  ctx.restore();
}

function drawShip(){
  const s = shipPos();
  const jx = shipShake ? Math.sin(t * 60) * shipShake * 5 : 0;
  ctx.save(); ctx.translate(s.x + jx, s.y); ctx.rotate(shipAng);
  const f = 8 + Math.random() * 7;
  ctx.fillStyle = '#FF9A3C'; ctx.beginPath(); ctx.moveTo(-7, 18); ctx.quadraticCurveTo(0, 18 + f * 2, 7, 18); ctx.fill();
  ctx.fillStyle = '#FFE066'; ctx.beginPath(); ctx.moveTo(-3.5, 18); ctx.quadraticCurveTo(0, 18 + f, 3.5, 18); ctx.fill();
  ctx.fillStyle = C.coral;
  ctx.beginPath(); ctx.moveTo(-9, 2); ctx.lineTo(-22, 22); ctx.lineTo(-8, 17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(9, 2); ctx.lineTo(22, 22); ctx.lineTo(8, 17); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath();
  ctx.moveTo(0, -30); ctx.bezierCurveTo(16, -16, 14, 8, 10, 20); ctx.lineTo(-10, 20); ctx.bezierCurveTo(-14, 8, -16, -16, 0, -30); ctx.fill();
  ctx.strokeStyle = 'rgba(30,58,95,.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = C.coral; ctx.beginPath(); ctx.moveTo(0, -30); ctx.bezierCurveTo(8, -24, 11, -19, 12, -15); ctx.lineTo(-12, -15); ctx.bezierCurveTo(-11, -19, -8, -24, 0, -30); ctx.fill();
  ctx.fillStyle = C.sky; ctx.beginPath(); ctx.arc(0, -3, 6.5, 0, 7); ctx.fill();
  ctx.strokeStyle = C.sun; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(-2, -5, 2, 0, 7); ctx.fill();
  ctx.restore();
}

function draw(){
  drawBackground();
  const order = animals.slice().sort((p, q) => (p === target) - (q === target));
  order.forEach(drawAnimal);
  for (const b of bullets){
    b.trail.forEach((p, i) => {
      ctx.globalAlpha = (i + 1) / b.trail.length * .6; ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2 + i * .5, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.fillStyle = b.c; star(b.x, b.y, 9, t * 8); ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawShip();
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state !== 'paused'){ t += dt; update(dt); }
  draw(); updateKbdHints();
  requestAnimationFrame(frame);
}

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = animals.find(a => !a.done && Math.hypot(animX(a) - px, animY(a) + R() * .4 - py) < R() * 1.6);
  if (hit){ target = hit; audio(); speak(sayWord(hit.def), LANG()); }
});

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state !== 'play'){
    if (e.target && e.target.tagName === 'INPUT' && e.target.id !== 'pName'){
      if (e.key === 'Enter'){ e.preventDefault(); if (e.target.id === 'familyInput') joinFamily(); if (e.target.id === 'familyNameInput') saveFamilyName(); }
      return;
    }
    if (!$('#editor').hidden){
      if (e.key === 'Enter'){ e.preventDefault(); saveEditor(); }
      else if (e.key === 'Escape' && $('#editor').parentNode.id !== 'modalSlot') closeEditor();
      return;
    }
    if (!$('#home').hidden && e.key === 'Escape'){ showHomeView('main'); return; }
    if (!pmenu.hidden && e.key === 'Escape'){ closeMenu(); return; }
    if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))){ e.preventDefault(); go(); }
    return;
  }
  if (e.key === 'Escape'){ target = null; return; }
  if (e.key === 'Enter'){
    e.preventDefault();
    const a = target || animals.filter(o => !o.done).sort((p, q) => q.y - p.y)[0];
    if (a){ audio(); speak(sayWord(a.def), LANG()); }
    return;
  }
  if (isJa() && (e.key === '-' || e.key === 'ー')){ e.preventDefault(); if (!e.repeat) press('ー'); return; }
  let k = (e.key && e.key.length === 1) ? e.key.toLowerCase() : '';
  if (!/^[a-z]$/.test(k) && /^Key[A-Z]$/.test(e.code || '')) k = e.code.slice(3).toLowerCase();
  if (!/^[a-z]$/.test(k)) return;
  e.preventDefault();
  if (!e.repeat) (isJa() ? pressRomaji(k) : press(k));
});

// ---------- leaderboard: our family, or everyone who plays (Firebase) ----------
// Each child's public entry is leaderboard/<child id>: name, avatar and how many different items they
// collected per theme. It holds no family code, so it can't be used to reach anyone's collection.
const worldCache = {};                                          // theme -> { at, rows } (refetched after 20 s)
const scoresOf = (q, mode) => ({ zoo: gotOf(q, byTheme('zoo'), mode), car: gotOf(q, byTheme('car'), mode), food: gotOf(q, byTheme('food'), mode),
  job: gotOf(q, byTheme('job'), mode), all: gotOf(q, ITEMS, mode) });
const boardId = (id, mode) => id + MODE_BOARD[mode];            // one board per way of playing
const modeOfBoard = id => (MODES.find(m => MODE_BOARD[m] && id.endsWith(MODE_BOARD[m])) || 'abc');
const lbSent = {};
// a child goes on the public board only with a real name (not the default "Bé 1") and a family name
const hasOwnName = name => !!name && !/^Bé \d+$/.test(String(name).trim());
const onBoard = q => hasOwnName(q.name) && !!familyName;
function publishScore(q){
  if (!fb || !q) return;
  MODES.forEach(mode => {
    const id = boardId(q.id, mode), sc = scoresOf(q, mode), stars = modeStars(q, mode), key = JSON.stringify([q.name, q.icon, familyName, sc, stars, onBoard(q)]);
    if (lbSent[id] === key) return;                             // nothing new to tell
    lbSent[id] = key;
    const ref = fb.fs.doc(fb.db, 'leaderboard', id);
    const body = Object.assign({ name: q.name, icon: q.icon, family: familyName, updated: Date.now() }, sc);
    // "stars" needs the newer security rules; until they are published, keep sending the rest
    const write = sc.all > 0 && onBoard(q)
      ? fb.fs.setDoc(ref, Object.assign({ stars }, body)).catch(() => fb.fs.setDoc(ref, body))
      : fb.fs.deleteDoc(ref);                                   // nothing collected yet, or names not set: stay off the board
    write.then(() => { Object.keys(worldCache).forEach(k => delete worldCache[k]); }).catch(() => { delete lbSent[id]; });
  });
}
function unpublishScore(id){
  MODES.forEach(mode => {
    if (fb) fb.fs.deleteDoc(fb.fs.doc(fb.db, 'leaderboard', boardId(id, mode))).catch(() => {});
    delete lbSent[boardId(id, mode)];
  });
}
async function loadWorld(theme, mode){
  const cacheKey = mode + ':' + theme;
  const c = worldCache[cacheKey];
  if (c && Date.now() - c.at < 20000) return c.rows;
  const { fs, db } = fb;
  const snap = await fs.getDocs(fs.query(fs.collection(db, 'leaderboard'), fs.orderBy(theme, 'desc'), fs.limit(200)));
  const rows = snap.docs.map(d => { const v = d.data(); return { id: d.id, name: String(v.name || ''), icon: String(v.icon || ''), family: String(v.family || ''), n: v[theme] | 0 }; })
    .filter(r => r.n > 0 && r.family && hasOwnName(r.name) && modeOfBoard(r.id) === mode)
    .map(r => Object.assign(r, { id: r.id.slice(0, r.id.length - MODE_BOARD[mode].length) }))
    .slice(0, 50);
  worldCache[cacheKey] = { at: Date.now(), rows };
  return rows;
}
function drawRankRows(rows, total, byStars){

// total stars from everyone's public entries: each entry holds that collection's stars
async function loadStars(){
  const c = worldCache.stars;
  if (c && Date.now() - c.at < 20000) return c.rows;
  const { fs, db } = fb;
  const snap = await fs.getDocs(fs.query(fs.collection(db, 'leaderboard'), fs.limit(1000)));
  const kids = {};
  snap.docs.forEach(d => {
    const v = d.data(), mode = modeOfBoard(d.id), id = d.id.slice(0, d.id.length - MODE_BOARD[mode].length);
    if (!v.family || !hasOwnName(v.name)) return;
    const k = kids[id] || (kids[id] = { id, name: String(v.name), icon: String(v.icon || ''), family: String(v.family), n: 0, at: 0 });
    k.n += v.stars | 0;
    if ((v.updated | 0) > k.at){ k.at = v.updated | 0; k.name = String(v.name); k.icon = String(v.icon || ''); k.family = String(v.family); }
  });
  const rows = Object.values(kids).filter(r => r.n > 0).sort((a, b) => b.n - a.n).slice(0, 50);
  worldCache.stars = { at: Date.now(), rows };
  return rows;
}

// ---------- sync: players and collections shared by every device that opens the online link ----------
// Each child is one document players/<id> holding name, icon, collection, level, letter case and theme.
// Which child plays, sound, music and keyboard stay per device. The file opened from the Desktop has no
// shared store and simply keeps everything on that computer.
let shared = null, cloudReady = false;
const writing = {};
const cloudBody = q => ({ name: q.name, icon: q.icon, counts: q.counts || {}, level: q.level || 'easy',
  caps: q.caps || 'lower', theme: q.theme || 'zoo', created: q.created || 0 });
function setSync(mode){
  const note = $('#syncNote');
  note.hidden = mode === 'on' || mode === 'wait';                // all fine: say nothing
  note.textContent = {
    on:   '☁️ Đang đồng bộ giữa các máy.',
    wait: '☁️ Đang kết nối đồng bộ…',
    local:'💾 Chỉ lưu trên máy này, chưa đồng bộ.',
    read: 'Tài khoản này chỉ được xem, nên bộ sưu tập chỉ lưu trên máy này.',
    off:  'Tạm mất kết nối đồng bộ. Bộ sưu tập vẫn được lưu trên máy này.',
    full: 'Kho dữ liệu chung đã đầy, không thêm được bé mới.',
  }[mode];
}
// one write at a time per child, in order
function cloudWrite(id, fn){
  if (!shared) return;
  writing[id] = (writing[id] || Promise.resolve()).then(fn).catch(e => {
    const code = e && e.code;
    if (code === 'invalid_argument') { shared = null; setSync('read'); }
    else if (code === 'quota_exceeded') setSync('full');
    else if (code === 'revoked' || code === 'not_granted') { shared = null; setSync('local'); }
    else setSync('off');
  });
}
function cloudSave(q){ if (!q) return; const body = cloudBody(q); cloudWrite(q.id, () => shared.doc('players/' + q.id).set(body)); }
function cloudDelete(id){ cloudWrite(id, () => shared.doc('players/' + id).delete()); }
// a new catch only touches that one item, so two devices playing at once don't overwrite each other
function cloudCount(q, itemId){
  const n = q.counts[itemId], body = cloudBody(q);
  cloudWrite(q.id, () => shared.doc('players/' + q.id).update({ counts: { [itemId]: n } })
    .catch(() => shared.doc('players/' + q.id).set(body)));
}
function onPlayers(snap){
  if (snap.metadata.fromCache && !cloudReady) return;          // wait for the real shared list the first time
  let remote = snap.docs.map(d => Object.assign({ id: d.id }, JSON.parse(JSON.stringify(d.data()))));
  if (!cloudReady){
    cloudReady = true;
    // first time on this device: bring its players into the shared list (same name = same child)
    if (!store.get('cloudMerged', false)){
      players.forEach((lp, i) => {
        const match = remote.find(r => (r.name || '').trim().toLowerCase() === lp.name.trim().toLowerCase());
        if (match){
          const c = match.counts = match.counts || {};
          Object.keys(lp.counts || {}).forEach(k => { c[k] = Math.max(c[k] || 0, lp.counts[k]); });
          if (currentId === lp.id) currentId = match.id;
          cloudSave(match);
        } else if (!remote.length || Object.keys(lp.counts || {}).length || !/^Bé \d+$/.test(lp.name)){
          lp.created = lp.created || i + 1;                     // an empty default "Bé 1" isn't added to an existing family
          remote.push(lp); cloudSave(lp);
        }
      });
      store.set('cloudMerged', true);
    }
  }
  if (!remote.length) return;                                   // nothing shared yet: keep this device's list
  players = remote.sort((a, b) => (a.created || 0) - (b.created || 0));
  if (!players.some(q => q.id === currentId)) currentId = players[0].id;
  savePlayers();                                                // local copy for starting up offline
  const q = me();
  counts = q.counts = q.counts || {};
  const theme = THEMES[q.theme] ? q.theme : 'zoo', level = q.level || 'easy';
  const moved = theme !== settings.theme || level !== settings.level;
  settings.level = level; settings.caps = q.caps || 'lower';
  if (theme !== settings.theme){ settings.theme = theme; THEME_ITEMS = byTheme(theme); renderShelf(); }
  else playItems().forEach(d => updateSlot(d, false));
  if (moved) resetField();
  syncSeg(); syncPlayer(); syncTheme();
}
async function connectCloud(){
  let db = null;
  try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch(e){}
  if (db){                                                      // opened inside Claude: Claude's shared store
    shared = db; setSync('on');
    db.collection('players').onSnapshot(onPlayers, () => { setSync('off'); });
    return;
  }
  try { await connectFirebase(); } catch(e){ setSync('local'); }   // GitHub page / Desktop file: Firebase
}

// family code: 4 letters then 4 digits, no dash, e.g. HJCQ4829 (quick to type on any keyboard)
const CODE_LETTERS = 'ABCDEFGHJKMNPQRSTUVWXYZ';                // no I / L / O, which look like 1 and 0
const isFamilyCode = c => /^[A-Z]{4}[0-9]{4}$/.test(c);
const newFamilyCode = () => Array.from({ length: 4 }, () => CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)]).join('')
  + String(Math.floor(Math.random() * 10000)).padStart(4, '0');
// the same small surface the Claude store offers, so the sync code above works unchanged
function firebaseStore(code){
  const { fs, db } = fb, base = ['families', code, 'players'];
  return {
    doc: path => {
      const ref = fs.doc(db, ...base, path.split('/')[1]);
      return {
        set: d => fs.setDoc(ref, d),
        update: d => fs.setDoc(ref, d, { merge: true }),          // merges nested maps, e.g. one new catch in counts
        delete: () => fs.deleteDoc(ref),
      };
    },
  };
}
async function connectFirebase(){
  setSync('wait');
  const [app, fs] = await Promise.all([import(FIREBASE_SDK + 'firebase-app.js'), import(FIREBASE_SDK + 'firebase-firestore.js')]);
  fb = { fs, db: fs.getFirestore(app.initializeApp(FIREBASE_CONFIG)) };
  if (!isFamilyCode(familyCode)){ familyCode = newFamilyCode(); store.set('familyCode', familyCode); }
  subscribeFamily();
}
function subscribeFamily(){
  if (unsubFamily) unsubFamily();
  cloudReady = false;
  shared = firebaseStore(familyCode);
  $('#familyCode').textContent = familyCode;
  $('#familyBox').hidden = false;
  setSync('wait');
  if (unsubFamilyDoc) unsubFamilyDoc();
  unsubFamilyDoc = fb.fs.onSnapshot(fb.fs.doc(fb.db, 'families', familyCode),
    snap => { if (snap.exists()) setFamilyName(snap.data().name); }, () => {});
  unsubFamily = fb.fs.onSnapshot(fb.fs.collection(fb.db, 'families', familyCode, 'players'),
    snap => { onPlayers(snap); if (cloudReady){ setSync('on'); players.forEach(publishScore); } },
    () => setSync('off'));
}
function setFamilyName(name){
  name = String(name || '').trim().slice(0, 24);
  if (name === familyName) return;
  familyName = name; store.set('familyName', name);
  renderHome();
  players.forEach(publishScore);                                // the leaderboard shows the new name
}
function saveFamilyName(){
  const name = $('#familyNameInput').value.trim().slice(0, 24);
  setFamilyName(name);
  $('#familyNameMsg').textContent = ui(name ? 'saved' : 'famRemoved');
  setTimeout(() => { $('#familyNameMsg').textContent = ''; }, 2500);
  if (fb) fb.fs.setDoc(fb.fs.doc(fb.db, 'families', familyCode), { name }).catch(() => {
    $('#familyNameMsg').textContent = ui('saveFail');
  });
  audio(); speak(name ? 'Đã lưu tên gia đình' : 'Đã xoá tên gia đình', 'vi');
}
$('#familyNameSave').addEventListener('click', saveFamilyName);
function joinFamily(){
  const code = $('#familyInput').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const msg = $('#familyMsg');
  if (!isFamilyCode(code)){ msg.textContent = ui('codeFormat'); return; }
  if (code === familyCode){ msg.textContent = ui('codeSame'); return; }
  familyCode = code; store.set('familyCode', code);
  store.set('cloudMerged', false);                              // bring this device's children into that family
  msg.textContent = '';
  $('#familyJoin').hidden = true; $('#familyInput').value = '';
  subscribeFamily();
  audio(); speak('Đã kết nối', 'vi');
}
$('#familyJoinBtn').addEventListener('click', () => { $('#familyJoin').hidden = !$('#familyJoin').hidden; if (!$('#familyJoin').hidden) $('#familyInput').focus(); });
$('#familyGo').addEventListener('click', joinFamily);
connectCloud();
// a newer copy on the server: offer to reload it (the build stamps APP_VERSION; checked only on a web address)
const APP_VERSION = '20260927214705';
let newVersion = '', updSnooze = 0;
async function checkUpdate(){
  if (!/^https?:$/.test(location.protocol) || !/^\d+$/.test(APP_VERSION) || newVersion) return offerUpdate();
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), { cache:'no-store' });
    const m = (await r.text()).match(/const APP_VERSION = '(\d+)'/);
    if (m && Number(m[1]) > Number(APP_VERSION)) newVersion = m[1];
  } catch(e){}
  offerUpdate();
}
// never in the middle of a round: wait for the home screen or a pause
function offerUpdate(){
  if (!newVersion || state === 'play' || Date.now() < updSnooze || !$('#updateModal').hidden) return;
  $('#updateModal').hidden = false;
}
$('#updGo').addEventListener('click', () => location.replace(location.pathname + '?v=' + newVersion));   // a new address skips the cached copy
$('#updLater').addEventListener('click', () => { $('#updateModal').hidden = true; updSnooze = Date.now() + 10 * 60e3; });
setTimeout(checkUpdate, 5000);
setInterval(checkUpdate, 5 * 60e3);
setInterval(offerUpdate, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
if (document.fonts && document.fonts.load){
  document.fonts.load(`700 20px ${TEXT_FONT}`).catch(() => {});
  document.fonts.load('700 20px "Zen Maru Gothic"', 'あア').catch(() => {});   // kana on the play field
}
})();
</script>
